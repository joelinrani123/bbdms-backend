spring.application.name=bbdms

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/bbdms?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---------- Server ----------
server.port=8080

# ---------- CORS (frontend dev server) ----------
app.cors.allowed-origins=http://localhost:5173

# ---------- Default admin (seeded if admins table empty) ----------
app.admin.default-username=admin
app.admin.default-password=admin@123
